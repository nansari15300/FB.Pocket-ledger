  <div id="plCountryGate"></div>
  <template id="plMainFeaturesTpl">
    <section class="pl-gate-features" id="features">
      <h2 data-i18n="features">Features</h2>
      <p class="pl-gate-features-lead intro" data-intro="gate_features_lead">Same books on desktop, tablet, phone, and the web app.</p>
      <div class="pl-gate-feat-cards">
        <article class="pl-gate-link-card"><strong>Desktop</strong><span>Full voucher grid, reports and multi-company work.</span></article>
        <article class="pl-gate-link-card"><strong>Tablet</strong><span>Counter-friendly daybook, quick entry and approvals.</span></article>
        <article class="pl-gate-link-card"><strong>Mobile</strong><span>On-the-go entry, camera attachments, balance checks.</span></article>
      </div>
      <h3 class="feature-list-title">App features</h3>
      <p class="feature-list-lead intro" data-intro="feature_list_lead">What you get inside Pocket Ledger (web, Windows EXE, and Android APK).</p>
      <div class="feature-rows-scroll pl-gate-features-scroll">
        <ol class="feature-rows">
          <li><span class="feature-name">Multi-company books</span><span class="feature-desc">Create and switch companies without mixing ledgers.</span></li>
          <li><span class="feature-name">Sale vouchers</span><span class="feature-desc">Invoice sales with party, items, tax and narration.</span></li>
          <li><span class="feature-name">Purchase vouchers</span><span class="feature-desc">Record supplier bills and purchase returns flow.</span></li>
          <li><span class="feature-name">Receipt</span><span class="feature-desc">Receive money against parties and open bills.</span></li>
          <li><span class="feature-name">Payment</span><span class="feature-desc">Pay suppliers and settle outstanding purchases.</span></li>
          <li><span class="feature-name">Contra</span><span class="feature-desc">Move funds between cash and bank accounts.</span></li>
          <li><span class="feature-name">Journal entries</span><span class="feature-desc">Manual debit/credit adjustments when needed.</span></li>
          <li><span class="feature-name">Inter-company vouchers</span><span class="feature-desc">Transfer between your own companies with linked books.</span></li>
          <li><span class="feature-name">Bill-wise linking</span><span class="feature-desc">Allocate receipts/payments to specific invoices.</span></li>
          <li><span class="feature-name">Edit lock when linked</span><span class="feature-desc">Linked vouchers stay protected so allocations stay correct.</span></li>
          <li><span class="feature-name">Party masters</span><span class="feature-desc">Customers and suppliers with contact and balance views.</span></li>
          <li><span class="feature-name">Party ledger</span><span class="feature-desc">Running balance and voucher history per party.</span></li>
          <li><span class="feature-name">Bank &amp; cash accounts</span><span class="feature-desc">Track multiple bank and cash books in one place.</span></li>
          <li><span class="feature-name">Staff masters</span><span class="feature-desc">Keep staff records for salary and operations.</span></li>
          <li><span class="feature-name">Tax setup</span><span class="feature-desc">Configure tax rates used on vouchers and reports.</span></li>
          <li><span class="feature-name">Items / stock catalog</span><span class="feature-desc">Maintain items for sale and purchase lines.</span></li>
          <li><span class="feature-name">Daybook</span><span class="feature-desc">See today’s (or any day’s) vouchers in one list.</span></li>
          <li><span class="feature-name">Dashboard KPIs</span><span class="feature-desc">Sale, purchase, payment and cash movement at a glance.</span></li>
          <li><span class="feature-name">Reports suite</span><span class="feature-desc">Ledgers, daybook and business reports from the same data.</span></li>
          <li><span class="feature-name">Voucher search &amp; filters</span><span class="feature-desc">Find entries by party, type, date or voucher number.</span></li>
          <li><span class="feature-name">Attachment upload</span><span class="feature-desc">Attach bills, scans and photos to vouchers.</span></li>
          <li><span class="feature-name">Camera capture (mobile)</span><span class="feature-desc">Snap documents on phone and link them to entries.</span></li>
          <li><span class="feature-name">Image preview</span><span class="feature-desc">Open attachments clearly without leaving the voucher.</span></li>
          <li><span class="feature-name">PDF portal preview</span><span class="feature-desc">Sharp first-page PDF preview in the attachment portal.</span></li>
          <li><span class="feature-name">Attachment gallery</span><span class="feature-desc">Browse company attachments in one place.</span></li>
          <li><span class="feature-name">Local-first data</span><span class="feature-desc">Books stay usable on device; sync is optional.</span></li>
          <li><span class="feature-name">Online company sync</span><span class="feature-desc">Live Firebase sync for companies you keep in the cloud.</span></li>
          <li><span class="feature-name">Cloud attachment sync</span><span class="feature-desc">Storage-backed files for online companies.</span></li>
          <li><span class="feature-name">PL Server (LAN share)</span><span class="feature-desc">Share selected companies on your local network.</span></li>
          <li><span class="feature-name">PL Server live delta</span><span class="feature-desc">Host and clients stay updated with change-only sync.</span></li>
          <li><span class="feature-name">Backup &amp; restore (.plbp)</span><span class="feature-desc">Portable company backup with attachments.</span></li>
          <li><span class="feature-name">Auto backup scheduler</span><span class="feature-desc">Schedule recurring local backups from settings.</span></li>
          <li><span class="feature-name">Windows EXE install</span><span class="feature-desc">Desktop installer for offline-friendly office use.</span></li>
          <li><span class="feature-name">Android APK</span><span class="feature-desc">Native Android build for shop-floor and field entry.</span></li>
          <li><span class="feature-name">Web app under /app</span><span class="feature-desc">Browser access with the same product surface.</span></li>
          <li><span class="feature-name">Release update check</span><span class="feature-desc">EXE/APK can prompt when a newer published build exists.</span></li>
          <li><span class="feature-name">Versioned downloads</span><span class="feature-desc">Pick latest or recent prior EXE/APK from Downloads.</span></li>
          <li><span class="feature-name">Settings &amp; preferences</span><span class="feature-desc">Company, sync, backup and display controls in one area.</span></li>
        </ol>
      </div>
    </section>
  </template>
