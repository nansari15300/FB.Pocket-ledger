<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Notice — Pocket Ledger</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="../../styles.css?v=20261028-190500" />
  <link rel="stylesheet" href="../../css/website-settings.css?v=20261110-0810" />
  <link rel="stylesheet" href="../../css/color-mode.css?v=20261028-195200" />
  <script src="../../js/color-mode.js?v=20261028-195200"></script>
  <style>
    .who { color: var(--muted); font-size: 0.9rem; }
    .row { margin: 0.85rem 0; }
    .row label { display: block; font-weight: 700; margin-bottom: 0.35rem; }
    .status { margin-top: 1rem; font-size: 0.95rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: #b42318; }
    .notice-textarea {
      width: min(42rem, 100%);
      min-height: 8rem;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font: inherit;
      line-height: 1.45;
      resize: vertical;
    }
    .check-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }
    .hint {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      max-width: 42rem;
    }
  </style>
</head>
<body class="website-settings-page" data-ws-active="notice">
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="../../">
        <span class="brand-mark" aria-hidden="true"></span>
        Pocket Ledger
      </a>
      <div class="ws-head-right">
        <span data-pl-site-chrome></span>
        <div class="nav-links">
          <span class="who" id="who"></span>
          <button type="button" class="btn btn-outline btn-sm" id="outBtn" hidden data-i18n="signout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="ws-shell">
    <div id="websiteSettingsNav"></div>
    <main class="ws-main">
      <section class="page-hero">
        <div class="wrap">
          <h1>Website notice</h1>
          <p>Type a short message for visitors on the marketing homepage.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap ws-card">
          <div class="content-block" id="authBox">
            

          </div>
          <div class="content-block" id="adminBox" hidden>
            <div class="row">
              <label for="noticeMessage">Message</label>
              <textarea id="noticeMessage" class="notice-textarea" placeholder="Example: New Windows build available — see Downloads."></textarea>
              <p class="hint">Shown in a banner at the top of pocket-ledger.com. Line breaks are kept.</p>
            </div>
            <div class="check-row">
              <input id="noticeEnabled" type="checkbox" />
              <label for="noticeEnabled" style="margin:0;font-weight:600">Show on website</label>
              <button type="button" class="btn btn-primary btn-sm" id="saveNoticeBtn" style="margin-left:auto">Save notice</button>
            </div>
          </div>
          <p class="status" id="status"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="../../js/site-data-config.js?v=20261031-1440"></script>
  <script src="../../js/site-data.js?v=20261031-1"></script>
  <script src="../../js/website-settings-nav.js?v=20261110-0800"></script>
  <script src="../../js/languages-iso.js?v=20261028-195200"></script>
  <script src="../../js/i18n-web.js?v=20261029-i18nmt"></script>
  <script src="../../js/i18n-translate.js?v=20261029-i18nmt"></script>
  <script src="../../js/site-chrome.js?v=20261110-0805"></script>
  <script src="../../js/website-notice-admin.js?v=20261031-1"></script>
</body>
</html>
