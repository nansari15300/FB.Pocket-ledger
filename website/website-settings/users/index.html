<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users — Pocket Ledger</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="../../styles.css?v=20261028-190500" />
  <link rel="stylesheet" href="../../css/website-settings.css?v=20261110-0810" />
  <link rel="stylesheet" href="../../css/color-mode.css?v=20261028-195200" />
  <script src="../../js/color-mode.js?v=20261028-195200"></script>
  <style>
    .who { color: var(--muted); font-size: 0.9rem; }
    .status { margin-top: 1rem; font-size: 0.95rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: #b42318; }
    /* Card: 40px gap on all four sides (same as Release upload) */
    body.website-settings-page .ws-main > .section { padding: 0; }
    body.website-settings-page .ws-main > .section > .wrap.users-card {
      max-width: none;
      width: auto;
      margin: 0;
      padding: 40px;
    }
    .users-card > .content-block { margin-bottom: 0; max-height: 70vh; overflow-y: auto; }
    .users-card > .status:empty { display: none; }
    .users-hint { margin: 0 0 1rem; color: var(--muted); font-size: 0.88rem; }
    .add-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .add-row input { flex: 1; min-width: 12rem; }
    .release-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .release-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .release-table th,
    .release-table td {
      padding: 0.55rem 0.65rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .release-table th {
      background: var(--paper);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .release-table tr:last-child td { border-bottom: 0; }
    .release-table .col-action { width: 1%; white-space: nowrap; text-align: right; }
    .users-empty { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.88rem; }
  </style>
</head>
<body class="website-settings-page" data-ws-active="users">
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="../../">
        <span class="brand-mark" aria-hidden="true"></span>
        Pocket Ledger
      </a>
      <div class="ws-head-right">
        <span data-pl-site-chrome></span>
        <div class="nav-links">
          <span class="who" id="who"></span>
          <button type="button" class="btn btn-outline btn-sm" id="outBtn" hidden data-i18n="signout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="ws-shell">
    <div id="websiteSettingsNav"></div>
    <main class="ws-main">
      <section class="page-hero">
        <div class="wrap">
          <h1>Users</h1>
          <p>People who can manage the website settings. Owners (main admins) cannot be removed.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap users-card">
          <div class="content-block" id="authBox">
          </div>
          <div class="content-block" id="adminBox" hidden>
            <h3 style="margin:0 0 0.35rem;font-size:1rem">Website users</h3>
            <p class="users-hint">Added users can manage the website settings too.</p>
            <div class="add-row" id="addAdminRow">
              <input id="newAdminEmail" type="email" placeholder="user@example.com" />
              <button type="button" class="btn btn-primary btn-sm" id="addAdminBtn">Add user</button>
            </div>
            <div class="release-table-wrap">
              <table class="release-table">
                <thead>
                  <tr>
                    <th>Email</th>
                    <th>Role</th>
                    <th class="col-action"></th>
                  </tr>
                </thead>
                <tbody id="adminList"></tbody>
              </table>
            </div>
            <p id="adminListEmpty" class="users-empty" hidden>No users yet.</p>
          </div>
          <p class="status" id="status"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="../../js/site-data-config.js?v=20261031-1440"></script>
  <script src="../../js/site-data.js?v=20261031-1"></script>
  <script src="../../js/website-settings-nav.js?v=20261110-0800"></script>
  <script src="../../js/languages-iso.js?v=20261028-195200"></script>
  <script src="../../js/i18n-web.js?v=20261029-i18nmt"></script>
  <script src="../../js/i18n-translate.js?v=20261029-i18nmt"></script>
  <script src="../../js/site-chrome.js?v=20261110-0805"></script>
  <script src="../../js/website-users-admin.js?v=20261110-0800"></script>
</body>
</html>
