<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Pocket Ledger</title>

  <script src="/js/countries.js?v=20261028-181900"></script>
  <script src="/js/country-gate.js?v=20261110-1554"></script>
  <script>
    /* Features is part of Home now. Global site home = / (country picker + features);
     * country site home = /home/?c=xx (same as the menu Home link). Keeps #hash. */
    (function () {
      var rec = null;
      try { rec = window.PLCountry && window.PLCountry.detect(); } catch (e) { rec = null; }
      var url = rec ? "/home/?c=" + encodeURIComponent(rec.cc) : "/";
      location.replace(url + (location.hash || ""));
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/" /></noscript>
</head>
<body>
  <p>Features are now on the <a href="/">Home page</a>.</p>
</body>
